<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起旅行 — 三套题材</title>
<style>
  :root{
    --sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    --serif:"SimSun","Songti SC",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:#e6e0d6; font-family:var(--sans);
    display:grid; place-items:center; -webkit-font-smoothing:antialiased;
  }

  .phone{
    width:min(390px,100vw); height:min(844px,100dvh);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    background:var(--card); color:var(--ink);
    --card:#fbf7f0; --ink:#2b2420; --ink2:#5a4a40; --muted:#8b7a6d; --faint:#9c8b7d;
    --line:#ece2d6; --line2:#e0d3c4;
    --accent:#c8392f; --accent2:#e8b64c; --deep:#2b2b30; --leaf:#6f8a5f;
    --lav:#f0e2cf; --daybg:#f7f0e4; --dock:rgba(255,252,246,.92);
    --display:var(--sans); --dw:700; --ds:-0.02em; --tsize:38px;
  }
  .phone[data-theme="is"]{
    --card:#f7f9fa; --ink:#1b2226; --ink2:#3f5158; --muted:#6d7c85; --faint:#7d8c95;
    --line:#e6ecef; --line2:#d8e2e7;
    --accent:#d4643a; --accent2:#a9c9dd; --deep:#14181c; --leaf:#6f8f5f;
    --lav:#e3edf2; --daybg:#eff4f6; --dock:rgba(255,255,255,.92);
    --dw:300; --ds:0.02em; --tsize:34px;
    background:#f7f9fa;
  }
  .phone[data-theme="dl"]{
    --card:#fbfaf5; --ink:#24333d; --ink2:#44585f; --muted:#7c8a92; --faint:#78858c;
    --line:#e8eae2; --line2:#dbe0d6;
    --accent:#2f6f8f; --accent2:#c9a26b; --deep:#3a5c8a; --leaf:#8fa06a;
    --lav:#e6eef1; --daybg:#f3f5ef; --dock:rgba(255,254,250,.92);
    --display:var(--serif); --dw:400; --ds:0.01em; --tsize:35px;
  }
  @media (min-width:391px){
    .phone{border-radius:26px; box-shadow:0 30px 70px rgba(40,30,20,.22), 0 2px 6px rgba(40,30,20,.07)}
  }

  .view{
    position:absolute; inset:0 0 78px 0; overflow-y:auto; overflow-x:hidden;
    transition:transform .34s cubic-bezier(.32,.72,.28,1), opacity .28s ease;
    scrollbar-width:none;
  }
  .view::-webkit-scrollbar{display:none}
  .view--day{transform:translateX(100%); opacity:0; pointer-events:none; background:var(--card)}
  .phone.no-anim .view{transition:none !important}
  .phone[data-view="day"] .view--overview{transform:translateX(-22%); opacity:0; pointer-events:none}
  .phone[data-view="day"] .view--day{transform:none; opacity:1; pointer-events:auto}

  .ov-top{display:flex; align-items:center; justify-content:space-between; padding:20px 24px 0}
  .ov-top__right{display:flex; align-items:center; gap:12px}
  .ov-top__label{font-size:14px; font-weight:700; letter-spacing:-.01em}
  .icon-btn{border:0; background:none; padding:4px; margin:-4px -6px -4px 0; cursor:pointer; color:var(--ink); display:grid; place-items:center; border-radius:8px}
  .icon-btn:active{background:var(--line)}

  .eyebrow{margin:22px 24px 0; font-size:10.5px; font-weight:700; letter-spacing:.16em; color:var(--ink2)}
  .ov-title{
    margin:10px 24px 0; font-family:var(--display); font-weight:var(--dw);
    font-size:var(--tsize); line-height:1.14; letter-spacing:var(--ds);
  }
  .ov-dates{margin:8px 24px 0; font-size:13.5px; color:var(--muted)}
  .ov-sub{margin:5px 24px 0; font-size:12px; color:var(--faint)}

  .hero-art{margin:20px 20px 6px; height:172px; border-radius:18px; overflow:hidden; position:relative; box-shadow:0 8px 22px rgba(40,30,20,.10)}
  .hero-art svg{display:block; width:100%; height:100%}

  .ov-people{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    gap:14px; padding:18px 24px 20px;
  }
  .avatars{display:flex}
  .avatar{
    width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
    font-size:11px; font-weight:700; color:#2c2a22; border:2px solid var(--card); margin-left:-8px;
  }
  .avatar:first-child{margin-left:0}
  .ov-people__title{font-size:14px; font-weight:700; margin:0; letter-spacing:-.005em}
  .ov-people__names{font-size:12.5px; color:var(--muted); margin:2px 0 0}
  .ov-people__view{font-size:11.5px; color:var(--faint); margin:3px 0 0; font-style:italic}
  .people-count{
    display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line2);
    border-radius:999px; padding:4px 9px 4px 7px; color:var(--ink2);
    font-size:11.5px; font-weight:700; line-height:1;
  }

  .ov-plan{margin:0; padding:4px 24px 10px; font-size:16px; font-weight:700; letter-spacing:-.01em}
  .days{list-style:none; margin:0; padding:0 20px 0; display:flex; flex-direction:column; gap:8px}
  .trip-foot{
    display:flex; align-items:center; justify-content:space-between;
    margin:16px 20px 0; padding-top:14px; border-top:1px dashed var(--line2);
    font-size:11.5px; color:var(--faint);
  }
  .link-btn{
    border:0; background:none; padding:0; cursor:pointer;
    font-family:inherit; font-size:11.5px; font-weight:700; color:var(--muted);
  }
  .link-btn:active{color:var(--ink2)}
  .day{
    display:grid; grid-template-columns:42px 1fr 44px 14px; align-items:center; gap:12px;
    padding:12px 14px 12px 16px; border-radius:14px; cursor:pointer;
    background:var(--daybg); position:relative; overflow:hidden;
  }
  .day::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent)}
  .day:active{filter:brightness(.98)}
  .day__dow{font-size:9.5px; font-weight:700; letter-spacing:.1em; color:var(--muted)}
  .day__num{font-size:22px; line-height:1.1; font-weight:700; margin-top:1px; font-variant-numeric:tabular-nums}
  .day__title{font-size:14px; font-weight:700; margin:0; letter-spacing:-.005em}
  .day__note{font-size:12px; color:var(--muted); margin:2px 0 0}
  .day__art{width:44px; height:44px; display:block; position:relative}
  .day__thumb{display:block; width:100%; height:100%; border-radius:50%; overflow:hidden}
  .edit-badge{
    position:absolute; right:-5px; bottom:-5px; width:19px; height:19px; border-radius:50%;
    border:2px solid var(--card); display:grid; place-items:center;
    font-size:9.5px; font-weight:700; color:#2c2a22; font-style:normal; line-height:1;
  }
  .day__art svg{display:block; width:100%; height:100%}
  .chev{color:var(--faint)}

  .day-top{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 0}
  .back{border:0; background:none; padding:6px; margin:-6px; cursor:pointer; color:var(--ink); display:grid; place-items:center; border-radius:8px}
  .back:active{background:var(--line)}
  .day-count{font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--muted)}
  .day-head{padding:8px 24px 0}
  .day-title{font-family:var(--display); font-size:26px; line-height:1.22; letter-spacing:var(--ds); margin:6px 0 0; font-weight:var(--dw)}
  .day-meta{font-size:12px; color:var(--muted); margin:6px 0 0}

  .daystrip{display:flex; gap:6px; padding:0 24px; margin:12px 0 0}
  .dchip{
    flex:1; border:1px solid var(--line2); background:none; border-radius:9px;
    padding:7px 4px; font-family:inherit; font-size:10.5px; font-weight:700; color:var(--muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .dchip b{font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums}
  .dchip.is-on{background:var(--lav); border-color:var(--line2); color:var(--ink)}
  .dchip.is-on b{color:var(--ink)}

  .map{margin:10px 16px 0; height:146px; border-radius:16px; overflow:hidden; background:var(--mapland); position:relative}
  .map svg{display:block; width:100%; height:100%}

  .stops-head{display:flex; align-items:baseline; justify-content:space-between; padding:14px 24px 8px}
  .stops-head h2{margin:0; font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--ink2)}
  .stops-head span{font-size:11.5px; color:var(--faint)}

  .stops{list-style:none; margin:0; padding:0 16px 20px; position:relative}
  .stop{
    display:grid; grid-template-columns:52px 1fr 18px; gap:12px; align-items:start;
    background:var(--card); border:1px solid var(--line2); border-radius:14px;
    padding:10px 12px 10px 14px; margin-bottom:7px; will-change:transform;
  }
  .stop__time{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); padding-top:1px}
  .stop__name{font-size:14px; font-weight:700; margin:0; letter-spacing:-.005em; line-height:1.35}
  .stop__note{font-size:11.5px; color:var(--muted); margin:3px 0 0}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip{
    font-size:10.5px; line-height:1; padding:5px 8px; border-radius:6px;
    background:var(--lav); color:var(--ink2); font-weight:700;
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  }
  .chip--book{background:var(--accent2); color:#3a2a10}
  .phone[data-theme="is"] .chip--book{background:#e3edf2; color:#2b4a5c}
  .phone[data-theme="dl"] .chip--book{background:#efe6d6; color:#6b4a24}
  .chip svg{width:10px; height:10px; flex:none}

  .handle{border:0; background:none; padding:2px 0; cursor:grab; color:var(--faint); display:grid; place-items:center; touch-action:none; border-radius:6px}
  .handle:active{cursor:grabbing; color:var(--ink2)}

  .stop.is-lifted{
    box-shadow:0 18px 36px rgba(40,30,20,.22), 0 3px 8px rgba(40,30,20,.10);
    border-color:var(--line2); transform:scale(1.015) rotate(-.6deg);
    cursor:grabbing; pointer-events:none; margin:0; background:var(--card);
  }
  .add-stop{
    border:1.5px dashed var(--line2); border-radius:14px; padding:10px;
    text-align:center; font-size:12px; font-weight:700; color:var(--muted);
    cursor:pointer; margin-top:2px;
  }
  .add-stop:active{color:var(--ink2)}

  .stop-ph{
    border:0; border-top:2px dashed var(--line2); border-radius:0 0 14px 14px; margin-bottom:8px;
    background:rgba(0,0,0,.025); transition:height .15s ease;
  }

  .drag-hint{display:none; align-items:center; gap:8px; margin:0 16px 10px; background:var(--lav); border-radius:10px; padding:9px 12px; font-size:11.5px; color:var(--ink2); font-weight:700}
  .drag-hint b{color:var(--ink)}
  .phone.demo-drag .drag-hint{display:flex}

  .toast{
    position:absolute; left:50%; bottom:84px; transform:translate(-50%,14px);
    background:var(--deep); color:#fff; font-size:12px; font-weight:700;
    padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease; white-space:nowrap;
    box-shadow:0 10px 24px rgba(0,0,0,.28);
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  .tabbar{
    position:absolute; left:16px; right:16px; bottom:12px; height:58px;
    display:grid; grid-template-columns:repeat(3,1fr); align-items:center;
    background:var(--dock); backdrop-filter:blur(16px) saturate(1.3);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid var(--line2); border-radius:29px; z-index:30;
    box-shadow:0 12px 30px rgba(40,30,20,.14);
  }
  .tab{border:0; background:none; cursor:pointer; display:grid; justify-items:center; gap:4px; font-family:inherit; font-size:10.5px; color:var(--muted); font-weight:700; padding:0}
  .tab svg{width:21px; height:21px; display:block}
  .tab__ico{position:relative; display:block; line-height:0}
  .tab.is-on{color:var(--ink)}
  .tab.is-on span:last-child{position:relative}
  .tab.is-on span:last-child::after{
    content:''; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    width:14px; height:2px; border-radius:1px; background:var(--accent);
  }
  .tab__dot{position:absolute; top:-1px; right:-3px; width:6px; height:6px; border-radius:50%; background:var(--accent)}

  .pin circle{fill:var(--deep); stroke:var(--card); stroke-width:2.5}
  .pin text{fill:#fff; font:700 10.5px var(--sans); text-anchor:middle; dominant-baseline:central}
  .pin.is-first circle{fill:var(--accent)}
  .route{fill:none; stroke:var(--deep); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
  .route-ghost{fill:none; stroke:var(--muted); stroke-width:2.2; stroke-dasharray:5 5; stroke-linecap:round; opacity:.7}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="torn" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.032" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="tornShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.032" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#2a2018" flood-opacity="0.22"/>
    </filter>
    <filter id="tornSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>

<div class="phone" id="phone" data-view="overview" data-theme="cq">

  <section class="view view--overview" id="viewOverview">
    <div class="ov-top">
      <span class="ov-top__label">我的行程</span>
      <div class="ov-top__right">
        <div class="avatars" id="avatars"></div>
        <button class="icon-btn" aria-label="分享行程">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>
          </svg>
        </button>
      </div>
    </div>

    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="ov-title" id="ovTitle"></h1>
    <p class="ov-dates" id="ovDates"></p>
    <p class="ov-sub" id="ovSub"></p>

    <div class="hero-art" id="heroArt"></div>

    <h2 class="ov-plan">行程</h2>
    <ul class="days" id="days"></ul>

    <div class="trip-foot">
      <span id="tripSum"></span>
      <button class="link-btn">＋ 添加一天</button>
    </div>
  </section>

  <section class="view view--day" id="viewDay">
    <div class="day-top">
      <button class="back" id="back" aria-label="返回行程">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="day-count" id="dayCount"></span>
      <button class="icon-btn" aria-label="更多">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </div>

    <div class="day-head">
      <h1 class="day-title" id="dayTitle"></h1>
      <p class="day-meta" id="dayMeta"></p>
    </div>

    <div class="daystrip" id="daystrip"></div>

    <div class="map">
      <svg viewBox="0 0 358 176" preserveAspectRatio="xMidYMid slice" id="mapSvg" aria-label="当天路线地图"></svg>
    </div>

    <div class="drag-hint" id="dragHint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 9l4-4 4 4"/><path d="M8 15l4 4 4-4"/></svg>
      <span>松手放下 — <b>路线会重新连</b></span>
    </div>

    <div class="stops-head">
      <h2>当天安排</h2>
      <span id="stopsCount"></span>
    </div>

    <ul class="stops" id="stops"></ul>
  </section>

  <div class="toast" id="toast">已同步 — 阿哲和小林现在能看到</div>

  <nav class="tabbar">
    <button class="tab is-on">
      <span class="tab__ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4.2v15.6"/>
          <circle cx="6" cy="7.8" r="1.85" fill="currentColor" stroke="none"/>
          <circle cx="6" cy="12.4" r="1.85" fill="currentColor" stroke="none"/>
          <circle cx="6" cy="17" r="1.85" fill="currentColor" stroke="none"/>
          <path d="M11.2 7.8h8.3"/>
          <path d="M11.2 12.4h6.2"/>
          <path d="M11.2 17h8.8"/>
        </svg>
      </span>
      <span>行程</span>
    </button>
    <button class="tab">
      <span class="tab__ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3.6h12v16.8l-3-1.7-3 1.7-3-1.7-3 1.7z"/>
          <path d="M9.2 8.4h5.6"/>
          <path d="M9.2 12.2h5.6"/>
          <path d="M9.2 16h3.2"/>
        </svg>
        <span class="tab__dot"></span>
      </span>
      <span>预订</span>
    </button>
    <button class="tab">
      <span class="tab__ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6.6" cy="8.6" r="2.4"/>
          <circle cx="12" cy="7.4" r="2.6"/>
          <circle cx="17.4" cy="8.6" r="2.4"/>
          <path d="M2.2 19.4c0-2.7 1.9-4.4 4.4-4.4"/>
          <path d="M21.8 19.4c0-2.7-1.9-4.4-4.4-4.4"/>
          <path d="M7.7 19.4c0-3 1.9-5 4.3-5s4.3 2 4.3 5"/>
        </svg>
      </span>
      <span>同行</span>
    </button>
  </nav>
</div>

<script>
/* ============ 插画：纸质拼贴 ============ */
const ART = {
  cq: () => `
  <svg viewBox="0 0 390 180" preserveAspectRatio="xMidYMax slice">
    <rect width="390" height="180" fill="#f8f0e2"/>
    <circle cx="58" cy="48" r="17" fill="#f0dcb4" filter="url(#tornSoft)"/>
    <path d="M0 92 L60 60 L120 88 L180 56 L244 88 L306 62 L390 90 L390 180 L0 180 Z" fill="#cdb99e" filter="url(#tornShadow)"/>
    <path d="M0 112 L76 86 L146 110 L214 84 L286 110 L390 92 L390 180 L0 180 Z" fill="#b7a086" filter="url(#tornShadow)"/>
    <path d="M0 146 Q 96 140, 192 148 T 390 142 L390 180 L0 180 Z" fill="#33414d" filter="url(#tornShadow)"/>
    <path d="M0 146 Q 96 140, 192 148 T 390 142" fill="none" stroke="#5d7180" stroke-width="1.6"/>

    <g filter="url(#tornShadow)">
      <rect x="8" y="90" width="34" height="42" fill="#e6d8c2"/>
      <path d="M2 90 L25 70 L48 90 Z" fill="#b06a4a"/>
      <rect x="44" y="98" width="30" height="34" fill="#efe2cc"/>
      <path d="M38 98 L59 80 L80 98 Z" fill="#c07a52"/>
      <rect x="76" y="94" width="30" height="38" fill="#e6d8c2"/>
      <path d="M70 94 L91 74 L112 94 Z" fill="#b06a4a"/>
    </g>
    <g fill="#7a6a58" opacity=".7">
      <rect x="16" y="98" width="8" height="9"/><rect x="30" y="98" width="8" height="9"/>
      <rect x="52" y="106" width="7" height="8"/><rect x="64" y="106" width="7" height="8"/>
      <rect x="84" y="102" width="7" height="8"/><rect x="95" y="102" width="7" height="8"/>
    </g>

    <g filter="url(#tornShadow)">
      <rect x="256" y="66" width="132" height="18" fill="#d99a55"/>
      <rect x="250" y="86" width="144" height="18" fill="#c9873f"/>
      <rect x="256" y="106" width="132" height="18" fill="#e0ab6a"/>
      <rect x="250" y="126" width="144" height="22" fill="#b87a3c"/>
    </g>
    <g fill="#8a5a2c">
      <rect x="252" y="62" width="140" height="5" rx="1"/>

    train: `<rect x="7" y="15" width="32" height="18" rx="3" fill="#c8392f" filter="url(#tornSoft)"/><g fill="${A.c2}"><rect x="11" y="19" width="6" height="7"/><rect x="20" y="19" width="6" height="7"/><rect x="29" y="19" width="6" height="7"/></g><circle cx="14" cy="36" r="3" fill="${A.c3}"/><circle cx="32" cy="36" r="3" fill="${A.c3}"/>`,
    stack: `<g filter="url(#tornSoft)"><rect x="8" y="14" width="30" height="7" fill="#d8a05c"/><rect x="6" y="22" width="34" height="7" fill="#c98a45"/><rect x="8" y="30" width="30" height="7" fill="#d8a05c"/></g>`,
    bowl:  `<path d="M8 22 h30 a15 12 0 0 1 -30 0 z" fill="#e8dcc6" filter="url(#tornSoft)"/><path d="M13 22 q10 -8 20 0" fill="none" stroke="#c8392f" stroke-width="2.6" filter="url(#tornSoft)"/>`,
    fall:  `<path d="M0 30 Q 23 24, 46 30 L46 46 L0 46 Z" fill="${A.c4}" filter="url(#tornSoft)"/><path d="M18 6 h6 v20 l-3 5 -3 -5 z" fill="#f4f7f8" filter="url(#tornSoft)"/>`,
    rock:  `<path d="M0 34 Q 12 22, 23 32 T 46 30 L46 46 L0 46 Z" fill="#1e2428" filter="url(#tornSoft)"/><rect x="12" y="16" width="5" height="18" fill="#3b4247" filter="url(#tornSoft)"/><rect x="22" y="12" width="5" height="22" fill="#3b4247" filter="url(#tornSoft)"/><rect x="32" y="18" width="5" height="16" fill="#3b4247" filter="url(#tornSoft)"/>`,
    car:   `<rect x="6" y="20" width="34" height="12" rx="3" fill="#d4643a" filter="url(#tornSoft)"/><rect x="13" y="13" width="20" height="9" rx="3" fill="#d4643a" filter="url(#tornSoft)"/><g fill="#e4ebee"><rect x="16" y="15" width="6" height="6"/><rect x="25" y="15" width="6" height="6"/></g><circle cx="14" cy="34" r="3.4" fill="#14181c"/><circle cx="32" cy="34" r="3.4" fill="#14181c"/>`,
    cabin: `<path d="M8 24 L23 13 L38 24 Z" fill="#8a3f2a" filter="url(#tornSoft)"/><rect x="12" y="24" width="22" height="15" fill="#e8e2d2" filter="url(#tornSoft)"/><rect x="20" y="29" width="6" height="10" fill="#14181c" opacity=".8"/>`,
    gate:  `<rect x="10" y="16" width="26" height="24" fill="#f8f6f0" filter="url(#tornSoft)"/><path d="M6 16 L23 7 L40 16 Z" fill="#6b7a80" filter="url(#tornSoft)"/><rect x="20" y="26" width="6" height="14" fill="#3a5c8a" opacity=".85"/>`,
    boat:  `<path d="M8 26 h30 l-6 10 h-18 z" fill="#e8e2d2" filter="url(#tornSoft)"/><path d="M23 8 L23 26" stroke="#8a7a62" stroke-width="2"/><path d="M23 10 L34 26 L23 26 Z" fill="#f8f6f0" filter="url(#tornSoft)"/>`,
    tree:  `<rect x="21" y="24" width="4" height="16" fill="#5c5a44"/><circle cx="23" cy="19" r="12" fill="${A.c4}" filter="url(#tornSoft)"/>`,
  };
  return `<svg viewBox="0 0 46 46">${shapes[kind] || shapes.roof}</svg>`;
}

/* ============ 渲染 ============ */
const params = new URLSearchParams(location.search);
const themeKey = params.get('theme') || 'cq';
const T = THEMES[themeKey] || THEMES.cq;
const phone = document.getElementById('phone');
phone.dataset.theme = themeKey;

let dayIndex = Number(params.get('day') ?? 1);
if(!Number.isFinite(dayIndex) || dayIndex < 0 || dayIndex >= T.days.length) dayIndex = 1;

const $ = (s, r=document) => r.querySelector(s);
const listEl = $('#stops');
const MAPW = 358, MAPH = 176;

document.getElementById('eyebrow').textContent = T.eyebrow;
document.getElementById('ovTitle').textContent = T.title;
document.getElementById('ovDates').textContent = T.dates;
document.getElementById('heroArt').innerHTML = ART[themeKey]();
document.getElementById('ovSub').textContent = `${T.peopleTitle} · ${T.peopleView}`;

const colorOf = n => T.colors[T.people.indexOf(n)] || '#ddd';

$('#avatars').innerHTML = T.people.map((n,i) =>
  `<span class="avatar" style="background:${T.colors[i]}">${n.slice(-1)}</span>`).join('');

const totalStops = T.days.reduce((n,d)=>n+d.stops.length,0);
const totalBudget = T.days.reduce((n,d)=>n+d.budget,0);
document.getElementById('tripSum').textContent = `${T.days.length} 天 · ${totalStops} 站 · 人均 ¥${totalBudget}`;

$('#days').innerHTML = T.days.map((d,i) => `
  <li class="day" data-i="${i}">
    <div><div class="day__dow">${d.dow}</div><div class="day__num">${d.num}</div></div>
    <div><p class="day__title">${d.title}</p><p class="day__note">${d.note}</p></div>
    <span class="day__art"><span class="day__thumb">${thumbSVG(T.thumbs[i])}</span>${d.edit ? `<i class="edit-badge" style="background:${colorOf(d.edit)}">${d.edit.slice(-1)}</i>` : ''}</span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </li>`).join('');

/* ---- 地图静态层 ---- */
const M = T.map;
$('#mapSvg').innerHTML = `
  <rect width="${MAPW}" height="${MAPH}" fill="${M.land}"/>
  <path d="M240 0 L358 0 L358 36 C 316 44, 272 34, 240 22 Z" fill="${M.park}" filter="url(#tornSoft)"/>
  <g stroke="${M.block2}" stroke-width="1">
    ${[[8,8,92,26],[124,8,64,26],[206,8,74,26],[8,54,92,26],[124,54,64,26],[206,54,74,26],[300,54,50,26],
       [124,100,64,26],[206,100,74,26],[300,100,50,26],[124,144,64,26],[206,144,74,26],[300,144,50,26]]
      .map(([x,y,w,h],i)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${i%2?M.block2:M.block}"/>`).join('')}
  </g>
  <g fill="${M.block2}" opacity=".85">
    <rect x="16" y="14" width="18" height="12" rx="1.5"/><rect x="40" y="14" width="12" height="12" rx="1.5"/>
    <rect x="132" y="60" width="20" height="13" rx="1.5"/><rect x="214" y="60" width="14" height="13" rx="1.5"/>
    <rect x="236" y="60" width="22" height="13" rx="1.5"/><rect x="214" y="106" width="18" height="13" rx="1.5"/>
    <rect x="132" y="106" width="26" height="13" rx="1.5"/><rect x="308" y="60" width="16" height="13" rx="1.5"/>
    <rect x="214" y="150" width="20" height="13" rx="1.5"/>
  </g>
  <g stroke="${M.street}" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M-10 46 L368 40"/><path d="M-10 92 L368 86"/><path d="M-10 136 L368 130"/>
    <path d="M110 -10 L116 186"/><path d="M198 -10 L192 186"/><path d="M292 -10 L288 186"/>
  </g>
  <path d="M0 132 C 34 128, 60 142, 78 176 L0 176 Z" fill="${M.water}"/>
  <path d="M0 132 C 34 128, 60 142, 78 176" fill="none" stroke="${M.water}" stroke-width="1.5" opacity=".8"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="7.5" letter-spacing=".6">
    ${M.labels.map(l => `<text x="${l.x}" y="${l.y}" fill="${l.c}">${l.t}</text>`).join('')}
  </g>
  <text x="${M.waterX}" y="${M.waterY}" font-family="Microsoft YaHei, sans-serif" font-size="7.5" letter-spacing="1.2" fill="#ffffff" opacity=".8">${M.waterName}</text>
  <path id="routeGhost" class="route-ghost" d=""/>
  <path id="route" class="route" d=""/>
  <g id="pins"></g>`;

const pinsEl = $('#pins');
let STOPS = [];

function smooth(pts){
  if(pts.length < 2) return '';
  let d = `M${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1.x + (p2.x - p0.x)/6, c1y = p1.y + (p2.y - p0.y)/6;
    const c2x = p2.x - (p3.x - p1.x)/6, c2y = p2.y - (p3.y - p1.y)/6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x} ${p2.y}`;
  }
  return d;
}
function drawRoute(order, ghost){
  const d = smooth(order.map(id => STOPS.find(s => s.id === id)).filter(Boolean).map(s => ({x:s.nx*MAPW, y:s.ny*MAPH})));
  if(ghost){ $('#routeGhost').setAttribute('d', d); $('#route').setAttribute('d',''); }
  else { $('#routeGhost').setAttribute('d',''); $('#route').setAttribute('d', d); }
  pinsEl.querySelectorAll('.pin').forEach(pin => {
    const i = order.indexOf(pin.dataset.id);
    pin.querySelector('text').textContent = i + 1;
    pin.classList.toggle('is-first', i === 0);
  });
}

function stopHTML(s){
  return `<li class="stop" data-id="${s.id}">
    <div class="stop__time">${s.time}</div>
    <div>
      <p class="stop__name">${s.name}</p>
      <p class="stop__note">${s.note}</p>
      <div class="chips">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><path d="M12 8v6"/><path d="M9 20l3-4 3 4"/></svg>${s.move}</span>
        <span class="chip chip--book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>${s.book}</span>
      </div>
    </div>
    <button class="handle" aria-label="调整 ${s.name} 顺序">
      <svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor">
        <circle cx="4" cy="4" r="1.4"/><circle cx="10" cy="4" r="1.4"/>
        <circle cx="4" cy="9" r="1.4"/><circle cx="10" cy="9" r="1.4"/>
        <circle cx="4" cy="14" r="1.4"/><circle cx="10" cy="14" r="1.4"/>
      </svg>
    </button>
  </li>`;
}

function renderDay(){
  const d = T.days[dayIndex];
  STOPS = d.stops.map(s => ({...s}));

  document.getElementById('dayCount').textContent = `第 ${dayIndex+1} 天 / 共 ${T.days.length} 天`;
  document.getElementById('dayTitle').textContent = d.title;
  document.getElementById('dayMeta').textContent = d.meta;
  document.getElementById('stopsCount').textContent = `${STOPS.length} 站 · 人均 ¥${d.budget}`;

  document.getElementById('daystrip').innerHTML = T.days.map((x,i) =>
    `<button class="dchip${i===dayIndex?' is-on':''}" data-i="${i}"><b>${x.num}</b>${x.dow}</button>`).join('');

  const viewer = T.peopleView.replace('的视角','');
  const others = T.people.filter(n => n !== viewer);
  document.getElementById('toast').textContent = `已同步 — ${others.join('和')} 现在能看到`;

  pinsEl.innerHTML = STOPS.map(s =>
    `<g class="pin" data-id="${s.id}" transform="translate(${(s.nx*MAPW).toFixed(1)} ${(s.ny*MAPH).toFixed(1)})"><circle r="11"/><text>1</text></g>`).join('');

  listEl.innerHTML = STOPS.map(stopHTML).join('') + '<li class="add-stop">＋ 添加停靠点</li>';
  drawRoute(STOPS.map(s => s.id));
}

/* ---- 导航 ---- */
function goDay(i){
  if(typeof i === 'number'){
    dayIndex = i;
    renderDay();
  }
  phone.dataset.view = 'day';
}
function goOverview(){ phone.dataset.view = 'overview'; }

$('#days').addEventListener('click', e => {
  const li = e.target.closest('.day');
  if(li) goDay(Number(li.dataset.i));
});
$('#daystrip').addEventListener('click', e => {
  const b = e.target.closest('.dchip');
  if(b && Number(b.dataset.i) !== dayIndex) goDay(Number(b.dataset.i));
});
$('#back').addEventListener('click', goOverview);

/* ---- 拖拽 ---- */
let drag = null;
function currentOrder(){
  return [...listEl.children]
    .filter(el => !el.classList.contains('is-lifted'))
    .map(el => el.classList.contains('stop-ph') ? drag?.id : el.dataset.id)
    .filter(Boolean);
}
listEl.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.handle');
  if(!handle || drag) return;
  e.preventDefault();
  const card = handle.closest('.stop');
  const rect = card.getBoundingClientRect();
  const ph = document.createElement('li');
  ph.className = 'stop-ph';
  ph.style.height = rect.height + 'px';
  card.after(ph);
  card.classList.add('is-lifted');
  Object.assign(card.style, {position:'fixed', left:rect.left+'px', top:rect.top+'px', width:rect.width+'px', zIndex:50});
  drag = { id: card.dataset.id, card, ph, offsetY: e.clientY - rect.top };
  phone.classList.add('is-dragging');
  listEl.setPointerCapture(e.pointerId);
  drawRoute(currentOrder(), true);
});
listEl.addEventListener('pointermove', e => {
  if(!drag) return;
  const { card, ph } = drag;
  card.style.top = (e.clientY - drag.offsetY) + 'px';
  const others = [...listEl.querySelectorAll('.stop:not(.is-lifted)')];
  const before = new Map(others.map(c => [c, c.getBoundingClientRect().top]));
  const target = others.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
  if(target){ if(ph.nextElementSibling !== target) target.before(ph); }
  else { const last = others[others.length-1]; if(last && last.nextElementSibling !== ph) last.after(ph); }
  const after = new Map(others.map(c => [c, c.getBoundingClientRect().top]));
  others.forEach(c => {
    const dy = before.get(c) - after.get(c);
    if(!dy) return;
    c.style.transition = 'none';
    c.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => {
      c.style.transition = 'transform .18s cubic-bezier(.32,.72,.28,1)';
      c.style.transform = '';
    });
  });
  drawRoute(currentOrder(), true);
});
function endDrag(commit){
  if(!drag) return;
  const { card, ph } = drag;
  const order = currentOrder();
  if(commit){
    const byId = new Map(STOPS.map(s => [s.id, s]));
    STOPS.length = 0;
    order.forEach(id => STOPS.push(byId.get(id)));
    T.days[dayIndex].stops = STOPS.map(s => ({...s}));
  }
  ph.replaceWith(card);
  card.classList.remove('is-lifted');
  card.style.cssText = '';
  drag = null;
  phone.classList.remove('is-dragging');
  drawRoute(STOPS.map(s => s.id));
  if(commit) showToast();
}
listEl.addEventListener('pointerup', e => { if(drag){ listEl.releasePointerCapture?.(e.pointerId); endDrag(true); } });
listEl.addEventListener('pointercancel', () => endDrag(true));

let toastTimer;
function showToast(){
  const t = $('#toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---- 静态拖拽态 ---- */
function renderDragDemo(){
  goDay();
  const card = listEl.querySelectorAll('.stop')[1];
  if(!card) return;
  const ph = document.createElement('li');
  ph.className = 'stop-ph';
  ph.style.height = card.getBoundingClientRect().height + 'px';
  listEl.insertBefore(ph, listEl.firstElementChild);
  const phRect = ph.getBoundingClientRect();
  const listRect = listEl.getBoundingClientRect();
  card.classList.add('is-lifted');
  Object.assign(card.style, {position:'absolute', left:'0', right:'0', top:(phRect.top - listRect.top + 12) + 'px'});
  phone.classList.add('is-dragging');
  phone.classList.add('demo-drag');
  drag = { id: card.dataset.id, card, ph, offsetY: 0 };
  drawRoute(currentOrder(), true);
  drag = null;
  card.style.pointerEvents = 'none';
}

renderDay();
const state = params.get('state') || 'overview';
if(state !== 'overview') phone.classList.add('no-anim');
if(state === 'day' || params.has('day')) goDay();
if(state === 'drag') requestAnimationFrame(() => requestAnimationFrame(renderDragDemo));

</script>
