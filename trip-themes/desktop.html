<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起旅行 · 桌面版</title>
<style>
  :root{
    --sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    --serif:"SimSun","Songti SC",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:#e4dfd6; font-family:var(--sans);
    display:grid; place-items:center; -webkit-font-smoothing:antialiased;
  }

  .app{
    width:min(1440px,100vw); height:min(900px,100vh);
    display:grid; grid-template-columns:300px 420px 1fr; grid-template-rows:60px 1fr;
    background:var(--card); color:var(--ink); overflow:hidden; position:relative;
    --card:#fbf7f0; --ink:#2b2420; --ink2:#5a4a40; --muted:#8b7a6d; --faint:#9c8b7d;
    --line:#ece2d6; --line2:#e0d3c4; --panel:#f6f0e6;
    --accent:#c8392f; --accent2:#e8b64c; --deep:#2b2b30; --leaf:#6f8a5f; --lav:#f3e6d2;
    --display:var(--sans); --dw:700; --ds:-0.02em;
  }
  .app[data-theme="is"]{
    --card:#f7f9fa; --ink:#1b2226; --ink2:#3f5158; --muted:#6d7c85; --faint:#7d8c95;
    --line:#e6ecef; --line2:#d8e2e7; --panel:#eef3f5;
    --accent:#d4643a; --accent2:#a9c9dd; --deep:#14181c; --leaf:#6f8f5f; --lav:#e6eff4;
    --dw:300; --ds:0.02em;
  }
  .app[data-theme="dl"]{
    --card:#fbfaf5; --ink:#24333d; --ink2:#44585f; --muted:#7c8a92; --faint:#78858c;
    --line:#e8eae2; --line2:#dbe0d6; --panel:#f2f4ee;
    --accent:#2f6f8f; --accent2:#c9a26b; --deep:#3a5c8a; --leaf:#8fa06a; --lav:#e8eff2;
    --display:var(--serif); --dw:400; --ds:0.01em;
  }
  @media (min-width:1441px){
    .app{border-radius:16px; box-shadow:0 30px 80px rgba(40,30,20,.24), 0 2px 8px rgba(40,30,20,.08)}
  }

  /* ---------- topbar ---------- */
  .topbar{
    grid-column:1/-1; display:flex; align-items:center; gap:18px;
    padding:0 22px; border-bottom:1px solid var(--line); background:var(--card);
  }
  .mark{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; letter-spacing:-.01em}
  .mark i{width:9px; height:9px; border-radius:50%; background:var(--accent); display:block}
  .topbar .eyebrow{font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--muted); margin:0}
  .topbar .spacer{flex:1}
  .avatars{display:flex}
  .avatar{
    width:27px; height:27px; border-radius:50%; display:grid; place-items:center;
    font-size:11px; font-weight:700; color:#2c2a22; border:2px solid var(--card); margin-left:-8px;
  }
  .avatar:first-child{margin-left:0}
  .ghost-btn{
    border:1px solid var(--line2); background:none; border-radius:999px; padding:7px 14px;
    font-family:inherit; font-size:12px; font-weight:700; color:var(--ink2); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .ghost-btn:hover{background:var(--panel)}

  /* ---------- sidebar ---------- */
  .sidebar{
    grid-row:2; grid-column:1; border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden; background:var(--card);
  }
  .cover{height:142px; overflow:hidden; position:relative; flex:none}
  .cover svg{display:block; width:100%; height:100%}
  .side-body{padding:20px 22px 0; overflow-y:auto; scrollbar-width:none}
  .side-body::-webkit-scrollbar{display:none}
  .trip-title{
    font-family:var(--display); font-weight:var(--dw); font-size:27px; line-height:1.2;
    letter-spacing:var(--ds); margin:0 0 6px;
  }
  .trip-dates{font-size:12.5px; color:var(--muted); margin:0 0 4px}
  .trip-people{font-size:12px; color:var(--faint); margin:0 0 22px}
  .side-label{font-size:10.5px; font-weight:700; letter-spacing:.16em; color:var(--muted); margin:0 0 10px}

  .daylist{list-style:none; margin:0; padding:0 0 20px}
  .dayitem{
    display:grid; grid-template-columns:38px 1fr; gap:12px; align-items:center;
    padding:11px 12px; margin-bottom:4px; border-radius:11px; cursor:pointer;
    border:1px solid transparent;
  }
  .dayitem:hover{background:var(--panel)}
  .dayitem.is-on{background:var(--lav); border-color:var(--line2)}
  .dayitem__dow{font-size:9.5px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-align:center}
  .dayitem__num{font-size:19px; font-weight:700; line-height:1.05; text-align:center; font-variant-numeric:tabular-nums}
  .dayitem__title{font-size:13px; font-weight:700; margin:0; letter-spacing:-.005em}
  .dayitem__note{font-size:11.5px; color:var(--muted); margin:2px 0 0}

  /* ---------- stops panel ---------- */
  .panel{
    grid-row:2; grid-column:2; border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden; background:var(--card);
  }
  .panel-head{padding:24px 26px 14px; border-bottom:1px solid var(--line); flex:none}
  .day-kicker{font-size:10.5px; font-weight:700; letter-spacing:.16em; color:var(--accent); margin:0 0 8px}
  .day-title{font-family:var(--display); font-weight:var(--dw); font-size:24px; line-height:1.25; letter-spacing:var(--ds); margin:0 0 8px}
  .day-meta{font-size:12px; color:var(--muted); margin:0}

  .stops{list-style:none; margin:0; padding:16px 22px 22px; overflow-y:auto; flex:1; position:relative; scrollbar-width:none}
  .stops::-webkit-scrollbar{display:none}

  .stop{
    display:grid; grid-template-columns:56px 1fr 20px; gap:14px; align-items:start;
    background:var(--card); border:1px solid var(--line2); border-radius:13px;
    padding:13px 13px 13px 16px; margin-bottom:9px; will-change:transform;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .stop:hover{border-color:var(--muted); box-shadow:0 2px 10px rgba(40,30,20,.06)}
  .stop__time{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); padding-top:2px}
  .stop__name{font-size:14px; font-weight:700; margin:0; letter-spacing:-.005em; line-height:1.35}
  .stop__note{font-size:11.5px; color:var(--muted); margin:3px 0 0}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .chip{
    font-size:10.5px; line-height:1; padding:5px 8px; border-radius:6px;
    background:var(--lav); color:var(--ink2); font-weight:700;
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  }
  .chip--book{background:var(--accent2); color:#3a2a10}
  .app[data-theme="is"] .chip--book{background:#e3edf2; color:#2b4a5c}
  .app[data-theme="dl"] .chip--book{background:#efe6d6; color:#6b4a24}
  .chip svg{width:10px; height:10px; flex:none}

  .handle{
    border:0; background:none; padding:3px 0; cursor:grab; color:var(--faint);
    display:grid; place-items:center; touch-action:none; border-radius:6px; opacity:.45;
    transition:opacity .15s ease;
  }
  .stop:hover .handle{opacity:1}
  .handle:active{cursor:grabbing; color:var(--ink2)}

  .stop.is-lifted{
    box-shadow:0 22px 44px rgba(40,30,20,.24), 0 3px 10px rgba(40,30,20,.12);
    border-color:var(--muted); transform:scale(1.015) rotate(-.5deg);
    cursor:grabbing; pointer-events:none; margin:0; background:var(--card);
  }
  .add-stop{
    list-style:none; border:1.5px dashed var(--line2); border-radius:13px;
    padding:15px; text-align:center; font-size:12px; font-weight:700; color:var(--muted);
    cursor:pointer; margin-top:2px;
  }
  .add-stop:hover{color:var(--ink2); border-color:var(--muted)}

  .stop-ph{
    border:0; border-top:2px dashed var(--muted); border-radius:0 0 13px 13px; margin-bottom:9px;
    background:rgba(0,0,0,.022); transition:height .15s ease;
  }

  .hint{
    display:none; align-items:center; gap:8px; margin:0 22px 12px;
    background:var(--lav); border-radius:9px; padding:9px 12px;
    font-size:11.5px; color:var(--ink2); font-weight:700;
  }
  .hint b{color:var(--ink)}
  .app.is-dragging .hint{display:flex}

  .panel-foot{
    flex:none; border-top:1px solid var(--line); padding:13px 26px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; color:var(--muted);
  }
  .panel-foot b{color:var(--ink2); font-weight:700}

  .toast{
    position:absolute; left:50%; bottom:74px; transform:translate(-50%,12px);
    background:var(--deep); color:#fff; font-size:12.5px; font-weight:700;
    padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease; white-space:nowrap;
    box-shadow:0 12px 28px rgba(0,0,0,.3); z-index:60;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* ---------- map ---------- */
  .map{grid-row:2; grid-column:3; position:relative; overflow:hidden; background:var(--mapland,#eef4f6)}
  .map svg{display:block; width:100%; height:100%}
  .map-badge{
    position:absolute; left:22px; top:22px; display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.94); border-radius:999px; padding:8px 14px;
    font-size:11.5px; font-weight:700; color:var(--ink2);
    box-shadow:0 4px 14px rgba(40,30,20,.12);
  }
  .map-badge i{width:7px; height:7px; border-radius:50%; background:var(--accent); display:block}
  .map-legend{
    position:absolute; right:22px; bottom:22px; background:rgba(255,255,255,.94);
    border-radius:12px; padding:11px 14px; font-size:11px; color:var(--ink2);
    box-shadow:0 4px 14px rgba(40,30,20,.12); line-height:1.7;
  }
  .map-legend b{display:block; font-size:10px; letter-spacing:.12em; color:var(--muted); margin-bottom:4px; font-weight:700}

  .pin circle{fill:var(--deep); stroke:#fff; stroke-width:2.5}
  .pin text{fill:#fff; font:700 11px var(--sans); text-anchor:middle; dominant-baseline:central}
  .pin.is-first circle{fill:var(--accent)}
  .pin .pin-label{fill:var(--ink2); font:700 10.5px var(--sans); text-anchor:middle}
  .route{fill:none; stroke:var(--deep); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .route-ghost{fill:none; stroke:var(--muted); stroke-width:2.4; stroke-dasharray:6 6; stroke-linecap:round; opacity:.75}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="torn" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.032" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="tornShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.032" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#2a2018" flood-opacity="0.22"/>
    </filter>
    <filter id="tornSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>

<div class="app" id="app" data-theme="cq">

  <div class="topbar">
    <span class="mark"><i></i>一起旅行</span>
    <p class="eyebrow" id="topEyebrow"></p>
    <span class="spacer"></span>
    <div class="avatars" id="avatars"></div>
    <button class="ghost-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      分享行程
    </button>
  </div>

  <aside class="sidebar">
    <div class="cover" id="cover"></div>
    <div class="side-body">
      <h1 class="trip-title" id="tripTitle"></h1>
      <p class="trip-dates" id="tripDates"></p>
      <p class="trip-people" id="tripPeople"></p>
      <p class="side-label">行程</p>
      <ul class="daylist" id="daylist"></ul>
    </div>
  </aside>

  <section class="panel">
    <div class="panel-head">
      <p class="day-kicker" id="dayKicker"></p>
      <h2 class="day-title" id="dayTitle"></h2>
      <p class="day-meta" id="dayMeta"></p>
    </div>
    <div class="hint" id="hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 9l4-4 4 4"/><path d="M8 15l4 4 4-4"/></svg>
      <span>松手放下 — <b>右边的路线会重新连</b></span>
    </div>
    <ul class="stops" id="stops"></ul>
    <div class="panel-foot">
      <span id="footLeft"></span>
      <span id="footRight"></span>
    </div>
  </section>

  <div class="map" id="map">
    <div class="map-badge"><i></i><span id="mapBadge"></span></div>
    <div class="map-legend">
      <b>图例</b>
      <span id="legendText"></span>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

/* ---- 当天 ---- */
const MAPW = 720, MAPH = 840;

function buildMap(M){
  const cw = 74, ch = 68, gap = 9;
  let blocks = '';
  for(let i=0;i<Math.ceil(MAPW/cw);i++){
    for(let j=0;j<Math.ceil(MAPH/ch);j++){
      const bx = i*cw+gap/2, by = j*ch+gap/2, w = cw-gap, h = ch-gap;
      blocks += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${w}" height="${h}" rx="3" fill="${M.block}"/>`;
      if((i*3+j*5)%4 !== 0){
        const iw = w*0.40, ih = h*0.40;
        const ix = bx + 5 + ((i+j)%3)*3, iy = by + 5 + ((i*2+j)%3)*3;
        blocks += `<rect x="${ix.toFixed(1)}" y="${iy.toFixed(1)}" width="${iw.toFixed(1)}" height="${ih.toFixed(1)}" rx="2" fill="${M.block2}"/>`;
        if((i+j)%2) blocks += `<rect x="${(ix+iw+4).toFixed(1)}" y="${iy.toFixed(1)}" width="${(w*0.24).toFixed(1)}" height="${(h*0.28).toFixed(1)}" rx="2" fill="${M.block2}"/>`;
      }
    }
  }
  let streets = '';
  for(let x=cw; x<MAPW; x+=cw) streets += `<path d="M${x} -10 L${x-6} ${MAPH+10}"/>`;
  for(let y=ch; y<MAPH; y+=ch) streets += `<path d="M-10 ${y} L${MAPW+10} ${y-5}"/>`;

  return `
  <rect width="${MAPW}" height="${MAPH}" fill="${M.land}"/>
  <path d="M${MAPW*.60} 0 L${MAPW} 0 L${MAPW} ${MAPH*.17} C ${MAPW*.83} ${MAPH*.20}, ${MAPW*.70} ${MAPH*.14}, ${MAPW*.60} ${MAPH*.10} Z" fill="${M.park}" filter="url(#tornSoft)"/>
  ${blocks}
  <g stroke="${M.street}" stroke-width="9" stroke-linecap="round" fill="none">${streets}</g>
  <path d="M0 ${MAPH*.70} C ${MAPW*.13} ${MAPH*.68}, ${MAPW*.24} ${MAPH*.82}, ${MAPW*.28} ${MAPH} L0 ${MAPH} Z" fill="${M.water}"/>
  <path d="M0 ${MAPH*.70} C ${MAPW*.13} ${MAPH*.68}, ${MAPW*.24} ${MAPH*.82}, ${MAPW*.28} ${MAPH}" fill="none" stroke="${M.water}" stroke-width="2" opacity=".85"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" letter-spacing="1">
    ${M.labels.map(l => `<text x="${l.nx*MAPW}" y="${l.ny*MAPH}" fill="${l.c}">${l.t}</text>`).join('')}
  </g>
  <text x="${M.waterAt.nx*MAPW}" y="${M.waterAt.ny*MAPH}" font-family="Microsoft YaHei, sans-serif" font-size="13" letter-spacing="2" fill="#ffffff" opacity=".85">${M.waterName}</text>
  <path id="routeGhost" class="route-ghost" d=""/>
  <path id="route" class="route" d=""/>
  <g id="pins"></g>`;
}

function smooth(pts){
  if(pts.length < 2) return '';
  let d = `M${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1.x + (p2.x - p0.x)/6, c1y = p1.y + (p2.y - p0.y)/6;
    const c2x = p2.x - (p3.x - p1.x)/6, c2y = p2.y - (p3.y - p1.y)/6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x} ${p2.y}`;
  }
  return d;
}

let STOPS = [];
const mapEl = $('#map');
const routeEl = () => document.getElementById('route');
const pinsEl = () => document.getElementById('pins');

function drawRoute(order, ghost){
  const r = routeEl(), g = document.getElementById('routeGhost');
  if(!r || !g) return;
  const d = smooth(order.map(id => STOPS.find(s => s.id === id)).filter(Boolean)
    .map(s => ({x:s.nx*MAPW, y:s.ny*MAPH})));
  if(ghost){ g.setAttribute('d', d); r.setAttribute('d',''); }
  else { g.setAttribute('d',''); r.setAttribute('d', d); }
  pinsEl().querySelectorAll('.pin').forEach(pin => {
    const i = order.indexOf(pin.dataset.id);
    pin.querySelector('text').textContent = i + 1;
    pin.classList.toggle('is-first', i === 0);
  });
}

        <circle cx="4" cy="14" r="1.4"/><circle cx="10" cy="14" r="1.4"/>
      </svg>
    </button>
  </li>`;
}

function renderDay(){
  const d = T.days[dayIndex];
  STOPS = d.stops.map(s => ({...s}));

  document.querySelectorAll('.dayitem').forEach((el,i) => el.classList.toggle('is-on', i === dayIndex));
  document.getElementById('dayKicker').textContent = `第 ${dayIndex+1} 天 / 共 ${T.days.length} 天`;
  document.getElementById('dayTitle').textContent = d.title;
  document.getElementById('dayMeta').textContent = d.meta;
  document.getElementById('mapBadge').textContent = `${d.title} · ${STOPS.length} 站`;
  document.getElementById('legendText').innerHTML =
    `${STOPS.length} 个停靠点<br>拖动左侧卡片可重排`;

  const viewer = T.view;
  const others = T.people.filter(n => n !== viewer);
  document.getElementById('toast').textContent = `已同步 — ${others.join('和')} 现在能看到`;
  document.getElementById('footLeft').innerHTML = `<b>3 人同行</b> · 改动实时同步`;
  document.getElementById('footRight').textContent = '最后更新 2 分钟前';

  mapEl.innerHTML = `<div class="map-badge"><i></i><span id="mapBadge">${d.title} · ${STOPS.length} 站</span></div>
    <div class="map-legend"><b>图例</b><span id="legendText">${STOPS.length} 个停靠点<br>拖动左侧卡片可重排</span></div>
    <svg viewBox="0 0 ${MAPW} ${MAPH}" preserveAspectRatio="xMidYMid slice">${buildMap(T.map)}</svg>`;

  document.getElementById('pins').innerHTML = STOPS.map(s =>
    `<g class="pin" data-id="${s.id}" transform="translate(${(s.nx*MAPW).toFixed(1)} ${(s.ny*MAPH).toFixed(1)})"><circle r="13"/><text>1</text><text class="pin-label" y="29" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">${s.name}</text></g>`).join('');

  listEl.innerHTML = STOPS.map(stopHTML).join('') + `<li class="add-stop">＋ 添加停靠点</li>`;
  drawRoute(STOPS.map(s => s.id));
}

/* ---- 拖拽 ---- */
let drag = null;
function currentOrder(){
  return [...listEl.children]
    .filter(el => !el.classList.contains('is-lifted'))
    .map(el => el.classList.contains('stop-ph') ? drag?.id : el.dataset.id)
    .filter(Boolean);
}

listEl.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.handle');
  if(!handle || drag) return;
  e.preventDefault();
  const card = handle.closest('.stop');
  const rect = card.getBoundingClientRect();
  const ph = document.createElement('li');
  ph.className = 'stop-ph';
  ph.style.height = rect.height + 'px';
  card.after(ph);
  card.classList.add('is-lifted');
  Object.assign(card.style, {position:'fixed', left:rect.left+'px', top:rect.top+'px', width:rect.width+'px', zIndex:80});
  drag = { id: card.dataset.id, card, ph, offsetY: e.clientY - rect.top };
  app.classList.add('is-dragging');
  listEl.setPointerCapture(e.pointerId);
  drawRoute(currentOrder(), true);
});

listEl.addEventListener('pointermove', e => {
  if(!drag) return;
  const { card, ph } = drag;
  card.style.top = (e.clientY - drag.offsetY) + 'px';
  const others = [...listEl.querySelectorAll('.stop:not(.is-lifted)')];
  const before = new Map(others.map(c => [c, c.getBoundingClientRect().top]));
  const target = others.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
  if(target){ if(ph.nextElementSibling !== target) target.before(ph); }
  else { const last = others[others.length-1]; if(last && last.nextElementSibling !== ph) last.after(ph); }
  const after = new Map(others.map(c => [c, c.getBoundingClientRect().top]));
  others.forEach(c => {
    const dy = before.get(c) - after.get(c);
    if(!dy) return;
    c.style.transition = 'none';
    c.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => {
      c.style.transition = 'transform .18s cubic-bezier(.32,.72,.28,1)';
      c.style.transform = '';
    });
  });
  drawRoute(currentOrder(), true);
});

function endDrag(commit){
  if(!drag) return;
  const { card, ph } = drag;
  const order = currentOrder();
  if(commit){
    const byId = new Map(STOPS.map(s => [s.id, s]));
    STOPS.length = 0;
    order.forEach(id => STOPS.push(byId.get(id)));
    T.days[dayIndex].stops = STOPS.map(s => ({...s}));
  }
  ph.replaceWith(card);
  card.classList.remove('is-lifted');
  card.style.cssText = '';
  drag = null;
  app.classList.remove('is-dragging');
  drawRoute(STOPS.map(s => s.id));
  if(commit) showToast();
}
listEl.addEventListener('pointerup', e => { if(drag){ listEl.releasePointerCapture?.(e.pointerId); endDrag(true); } });
listEl.addEventListener('pointercancel', () => endDrag(true));

let toastTimer;
function showToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---- 静态拖拽态 ---- */
function renderDragDemo(){
  const card = listEl.querySelectorAll('.stop')[1];
  if(!card) return;
  const ph = document.createElement('li');
  ph.className = 'stop-ph';
  ph.style.height = card.getBoundingClientRect().height + 'px';
  listEl.insertBefore(ph, listEl.firstElementChild);
  const phRect = ph.getBoundingClientRect();
  const listRect = listEl.getBoundingClientRect();
  card.classList.add('is-lifted');
  Object.assign(card.style, {position:'absolute', left:'26px', right:'8px', top:(phRect.top - listRect.top + 18) + 'px'});
  app.classList.add('is-dragging');
  drag = { id: card.dataset.id, card, ph, offsetY: 0 };
  drawRoute(currentOrder(), true);
  drag = null;
  card.style.pointerEvents = 'none';
}

renderDay();
if(params.get('state') === 'drag') requestAnimationFrame(() => requestAnimationFrame(renderDragDemo));
</script>
</body>
